
<!-- MENU LATERAL -->
<ion-menu
  menuId="menu-principal"
  contentId="main-content"
  side="start">

  <ion-content class="menu-content">

    <ion-list lines="none">

      <ion-item button routerLink="/sobremim" class="perfil-menu">
        <div class="perfil-container">
          <span>Seu perfil</span>
        </div>
      </ion-item>

      <ion-item button routerLink="/inicio">
        <ion-label>Início</ion-label>
        <ion-icon slot="end" name="home-outline"></ion-icon>
      </ion-item>

      <ion-item button routerLink="/seguranca">
        <ion-label>Checklist de segurança</ion-label>
      </ion-item>

      <ion-item button routerLink="/alerta">
        <ion-label>Sinais de Alerta</ion-label>
      </ion-item>

      <ion-item button routerLink="/risco">
        <ion-label>O que fazer?</ion-label>
      </ion-item>

      <ion-item button routerLink="/ocorrencias">
        <ion-label>Ocorrências</ion-label>
      </ion-item>

      <ion-item button routerLink="/relatorios">
        <ion-label>Relatórios</ion-label>
      </ion-item>

      <ion-item button routerLink="/chat">
        <ion-label>Chat</ion-label>
      </ion-item>

      <ion-item>
        <ion-label>Notificações</ion-label>
        <ion-toggle slot="end"></ion-toggle>
      </ion-item>

      <ion-item button routerLink="/home">
        <ion-label>Sair</ion-label>
      </ion-item>

    </ion-list>
  </ion-content>
</ion-menu>


<!-- CONTEÚDO PRINCIPAL -->
<ion-content
  [fullscreen]="true"
  class="pagina"
  id="main-content">

  <!-- BANNER -->
  <div class="banner">

    <img
      src="assets/trabalho3.jpg"
      class="banner-img"
      alt="Profissional trabalhando">

    <img
      src="assets/logo.png"
      class="logo-app"
      alt="Logo">

    <button
      class="botao-voltar"
      routerLink="/relatorios">
      Voltar
    </button>

    <ion-menu-button
      menu="menu-principal"
      autoHide="false"
      class="menu-botao">
    </ion-menu-button>

  </div>


  <!-- CONTEÚDO -->
  <div class="conteudo">

    <h1>Registrar Relatório</h1>

    <div class="relatorio">
      <h2>Novo relatório</h2>

      <p>
        Descreva abaixo a situação ou ocorrência identificada.
      </p>
    </div>

    <!-- CAIXA DE REGISTRO -->
    <div class="chat-box">

      <ion-textarea
        [(ngModel)]="relatorioTexto"
        placeholder="Descreva o relatório..."
        autoGrow="true"
        rows="4">
      </ion-textarea>

      <div class="chat-acoes">

        <button type="button" disabled>
          <ion-icon name="image-outline"></ion-icon>
        </button>

        <button type="button" disabled>
          <ion-icon name="code-slash-outline"></ion-icon>
        </button>

        <button type="button" disabled>
          <ion-icon name="mic-outline"></ion-icon>
        </button>

        <button
          type="button"
          class="botao-enviar"
          (click)="registrarRelatorio()"
          [disabled]="salvando">

          <ion-icon
            [name]="salvando ? 'hourglass-outline' : 'arrow-up-outline'">
          </ion-icon>

        </button>

      </div>

    </div>

  </div>

</ion-content>
