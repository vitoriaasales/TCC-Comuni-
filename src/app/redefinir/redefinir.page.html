
<ion-content [fullscreen]="true">
  <div class="container">

    <div class="logo">
      <h2>Comuni<span>+</span></h2>
    </div>

    <h1>Redefinir senha</h1>

    <ng-container *ngIf="!sessaoRecuperacao">

      <p class="descricao">
        Digite o e-mail da sua conta para iniciar a redefinição da senha.
      </p>

      <form [formGroup]="emailForm" (ngSubmit)="solicitarRecuperacao()">

        <div class="dados">
          <label>E-mail</label>

          <ion-input
            type="email"
            formControlName="email"
            placeholder="Digite seu e-mail"
            fill="solid">
          </ion-input>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="carregando">
            {{ carregando ? 'ENVIANDO...' : 'CONTINUAR' }}
          </ion-button>
        </div>

      </form>
    </ng-container>

    <ng-container *ngIf="sessaoRecuperacao">

      <p class="descricao">
        Confirme o e-mail da conta e cadastre sua nova senha.
      </p>

      <form [formGroup]="senhaForm" (ngSubmit)="redefinirSenha()">

        <div class="dados">

          <label>E-mail da conta</label>

          <ion-input
            type="email"
            formControlName="email"
            placeholder="Digite seu e-mail"
            fill="solid">
          </ion-input>

          <label>Nova senha</label>

          <ion-input
            type="password"
            formControlName="novaSenha"
            placeholder="Digite sua nova senha"
            fill="solid">
          </ion-input>

          <label>Confirmar nova senha</label>

          <ion-input
            type="password"
            formControlName="confirmarSenha"
            placeholder="Digite novamente sua nova senha"
            fill="solid">
          </ion-input>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="carregando">
            {{ carregando ? 'SALVANDO...' : 'SALVAR NOVA SENHA' }}
          </ion-button>

        </div>
      </form>
    </ng-container>

    <a routerLink="/login">Voltar para o login</a>

  </div>
</ion-content>
