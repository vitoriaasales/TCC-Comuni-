
<ion-content [fullscreen]="true">

  <div class="container">

    <div class="logo">
      <div class="logo-icones">
        <span class="icone-ouvido">◉</span>
        <span class="icone-fala">•••</span>
      </div>

      <h2>Comuni<span>+</span></h2>
    </div>

    <h1>Cadastro</h1>

    <p>
      Crie sua conta para acessar todos os recursos da plataforma.
    </p>

    <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar()">

      <div class="dados">

        <label>Email</label>

        <ion-input
          type="email"
          placeholder="example@gmail.com"
          fill="solid"
          formControlName="email">
        </ion-input>

        <div
          class="mensagem-erro"
          *ngIf="cadastroForm.get('email')?.touched && cadastroForm.get('email')?.invalid">

          Digite um e-mail válido.

        </div>

        <label>Senha</label>

        <ion-input
          type="password"
          placeholder="Digite sua senha"
          fill="solid"
          formControlName="senha">
        </ion-input>

        <div
          class="mensagem-erro"
          *ngIf="cadastroForm.get('senha')?.touched && cadastroForm.get('senha')?.invalid">

          A senha precisa ter pelo menos 6 caracteres.

        </div>

      </div>

      <br><br>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="cadastrando">

        {{ cadastrando ? 'Cadastrando...' : 'Cadastrar' }}

      </ion-button>

    </form>

    <br>

    <a routerLink="/login">Já tenho conta</a>

  </div>

</ion-content>
