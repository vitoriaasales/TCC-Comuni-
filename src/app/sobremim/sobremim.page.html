<ion-content [fullscreen]="true">

  <div class="perfil-page">

    <!-- IMAGEM DE CAPA -->
    <div class="banner-perfil">

      <img
        src="assets/trabalho3.jpg"
        alt="Imagem do perfil">

      <!-- BOTÃO VOLTAR -->
      <ion-button
        class="btn-voltar"
        fill="clear"
        routerLink="/inicio">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Voltar
      </ion-button>

      <!-- LIBRAS -->
      <button class="libras-btn">
        <img src="assets/libras.jpg" alt="LIBRAS">
      </button>

    </div>


    <!-- CONTEÚDO -->
    <div class="conteudo">

      <h2>Sobre mim</h2>


      <!-- CARREIRA -->
      <div class="secao">

        <h3>Sua Carreira</h3>

        <div class="card-carreira">

          <p>Nome: Jorge da Silva</p>
          <p>Idade: 33 anos</p>
          <p>Sexo: Masculino</p>
          <p>Setor: 1 - Máquinas operárias</p>

        </div>

      </div>


      <!-- O QUE EU PRECISO -->
      <div class="secao necessidade-section">

        <h3>O que eu preciso</h3>

        <div class="card-necessidade">

          <span class="mais">+</span>

          <p>
            Tenho déficit de audição e preciso
            de ajuda em momentos de risco e
            comprometimento à minha saúde
          </p>

        </div>

      </div>


      <!-- REGISTRO -->
      <div class="registro">

        <span class="placeholder">
          Registre seu perfil/histórico
        </span>


        <div class="registro-bottom">

          <div class="icones">

            <button>
              <ion-icon name="image-outline"></ion-icon>
            </button>

            <button>
              <ion-icon name="code-outline"></ion-icon>
            </button>

            <button>
              <ion-icon name="mic-outline"></ion-icon>
            </button>

          </div>


          <button class="enviar">
            <ion-icon name="arrow-up-outline"></ion-icon>
          </button>

        </div>

      </div>

    </div>

  </div>

</ion-content>
