
<ion-header [translucent]="true">
</ion-header>

<ion-content [fullscreen]="true" class="custom-background">

  <!-- BANNER -->
  <div class="banner">

    <ion-menu-button
      menu="menu-principal"
      class="menu-btn">
    </ion-menu-button>

    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9Ot3NysZBi0ZrZh6CvTztwo1yrEGWbkt-NTm85rwa07y5hhKzz0zx6-g&s=10"
      class="banner-img"
      alt="Profissionais trabalhando">

  </div>

  <div class="container">

    <h1>Segurança</h1>

    <p class="subtitulo">
      Confira os equipamentos de proteção antes de iniciar suas atividades.
    </p>

    <div class="resumo-progresso">
      <div class="resumo-topo">
        <span>Itens conferidos</span>
        <strong>{{ quantidadeConcluida }}/{{ itens.length }}</strong>
      </div>

      <div class="barra-fundo">
        <div
          class="barra-preenchida"
          [style.width.%]="percentual">
        </div>
      </div>

      <p>{{ percentual }}% concluído</p>
    </div>

    <!-- EQUIPAMENTOS -->
    <div
      class="item-checklist"
      *ngFor="let item of itens">

      <span>{{ item.nome }}</span>

      <ion-toggle
        [checked]="item.concluido"
        (ionChange)="atualizarItem(item, $event.detail.checked)">
      </ion-toggle>

    </div>

    <div class="botao-voltar">
      <ion-button fill="clear" routerLink="/inicio">
        Voltar
      </ion-button>
    </div>

  </div>

</ion-content>
