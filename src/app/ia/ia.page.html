
<div id="main-content">
  <ion-content [fullscreen]="true" class="pagina">

    <!-- BANNER -->
    <div class="banner">

      <img
        src="../assets/trabalho3.jpg"
        class="banner-img"
        alt="Profissionais trabalhando">

      <img
        src="../assets/logo.png"
        class="logo-app"
        alt="Logo">

      <button routerLink="/chat" class="botao-voltar">
        Voltar
      </button>

      <button class="botao-libras">
        <img
          src="../assets/libras.jpg"
          class="libras-icon"
          alt="Libras">
      </button>

    </div>

    <!-- CONTEÚDO DO CHAT -->
    <div class="conteudo">

      <!-- MENSAGEM INICIAL -->
      <div class="mensagem">
        <strong>Olá!</strong>
        <p>O que você deseja me perguntar?</p>
      </div>

      <!-- CONVERSA -->
      <div
        class="area-conversa"
        aria-live="polite"
        *ngIf="mensagens.length > 0 || carregando || erro">

        <div
          *ngFor="let mensagem of mensagens"
          class="balao-mensagem"
          [ngClass]="mensagem.autor">

          <strong>
            {{ mensagem.autor === 'usuario' ? 'Você' : 'Comuni+ IA' }}
          </strong>

          <p>{{ mensagem.texto }}</p>

        </div>

        <!-- CARREGAMENTO -->
        <div *ngIf="carregando" class="balao-mensagem ia">
          <strong>Comuni+ IA</strong>
          <p>Estou preparando sua resposta...</p>
        </div>

        <!-- ERRO -->
        <p *ngIf="erro" class="mensagem-erro">
          {{ erro }}
        </p>

      </div>

      <!-- CAIXA DE ENTRADA -->
      <div class="chat-box">

        <input
          type="text"
          name="mensagem"
          [(ngModel)]="textoMensagem"
          placeholder="Digite sua pergunta..."
          (keyup.enter)="enviarMensagem()"
          [disabled]="carregando">

        <div class="chat-acoes">

          <button type="button" disabled>
            <ion-icon name="image-outline"></ion-icon>
          </button>

          <button type="button" disabled>
            <ion-icon name="code-slash-outline"></ion-icon>
          </button>

          <button type="button" disabled>
            <ion-icon name="mic-outline"></ion-icon>
          </button>

          <button
            type="button"
            class="botao-enviar"
            (click)="enviarMensagem()"
            [disabled]="carregando || !textoMensagem.trim()">

            <ion-icon name="arrow-up-outline"></ion-icon>

          </button>

        </div>

      </div>

    </div>

  </ion-content>
</div>
