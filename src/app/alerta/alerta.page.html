<!-- MENU -->
<ion-menu
  menuId="menu-principal"
  contentId="main-content"
  side="start">

  <ion-content class="menu-content">

    <ion-list lines="none">

      <ion-item
        button
        routerLink="/sobremim"
        class="perfil-menu">

        <div class="perfil-container">
          <span>Seu perfil</span>
        </div>

      </ion-item>

      <ion-item button routerLink="/inicio">
        <ion-label>Início</ion-label>
        <ion-icon slot="end" name="home-outline"></ion-icon>
      </ion-item>

      <ion-item button routerLink="/seguranca">
        <ion-label>Checklist de segurança</ion-label>
      </ion-item>

      <ion-item button routerLink="/alerta">
        <ion-label>Sinais de Alerta</ion-label>
      </ion-item>

      <ion-item button routerLink="/risco">
        <ion-label>O que fazer?</ion-label>
      </ion-item>

      <ion-item button routerLink="/ocorrencias">
        <ion-label>Ocorrências</ion-label>
      </ion-item>

      <ion-item button routerLink="/relatorios">
        <ion-label>Relatórios</ion-label>
      </ion-item>

      <ion-item button routerLink="/chat">
        <ion-label>Chat</ion-label>
      </ion-item>

      <ion-item>
        <ion-label>Notificações</ion-label>
        <ion-toggle slot="end"></ion-toggle>
      </ion-item>

      <ion-item button routerLink="/home">
        <ion-label>Sair</ion-label>
      </ion-item>

    </ion-list>

  </ion-content>

</ion-menu>


<!-- CONTEÚDO -->
<ion-content
  [fullscreen]="true"
  class="background"
  id="main-content">


  <!-- Banner -->

  <div class="banner">

    <!-- BOTÃO DO MENU -->
    <ion-menu-button
      menu="menu-principal"
      class="menu-button">
    </ion-menu-button>


    <img
      src="../assets/trabalho4.jpg"
      class="banner-img">


    <!-- Logo -->

    <img
      src="../assets/logo.png"
      class="logo">


    <!-- Botão Voltar -->

    <ion-button
      class="btn-voltar"
      size="small"
      fill="solid"
      routerLink="/inicio">
      Voltar
    </ion-button>


    <!-- Ícone Libras -->

    <img
      src="../assets/libras.jpg"
      class="libras">

  </div>


  <!-- Conteúdo -->

  <div class="conteudo">

    <p class="subtitulo">
      Situação de risco
    </p>

    <h1>
      Sinais de Alerta
    </h1>


    <!-- Imagem única com todos os alertas -->

    <img
      src="../assets/riscos.png"
      class="imagem-riscos"
      alt="Sinais de Alerta">

  </div>

</ion-content>
